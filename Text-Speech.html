<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanGround Voice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
    }

    h1 { font-size: 1.4rem; letter-spacing: 0.05em; color: #aaa; }

    #mic-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid #555;
      background: #1e1e1e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    #mic-btn svg { pointer-events: none; }

    #mic-btn:hover { border-color: #888; }

    #mic-btn.listening {
      border-color: #e05;
      box-shadow: 0 0 0 6px rgba(238, 0, 85, 0.25);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(238, 0, 85, 0.25); }
      50%       { box-shadow: 0 0 0 14px rgba(238, 0, 85, 0.08); }
    }

    #status {
      font-size: 0.85rem;
      color: #666;
      min-height: 1.2em;
      text-align: center;
      transition: color 0.2s;
    }

    #status.state-listening { color: #e05; font-weight: bold; }
    #status.state-thinking { color: #f0a500; font-style: italic; }
    #status.state-error { color: #f44336; }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    #transcript-box {
      width: 100%;
      max-width: 560px;
      min-height: 120px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #ddd;
    }

    #transcript-box .interim { color: #888; font-style: italic; }

    .top-bar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
    }

    #user-name {
      font-size: 0.8rem;
      color: #666;
    }

    #logout-btn {
      padding: 6px 14px;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #aaa;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #logout-btn:hover {
      background: #333;
      color: #e8e8e8;
    }

  </style>
</head>
<body>

  <div class="top-bar">
    <span id="user-name"></span>
    <button id="logout-btn" onclick="handleLogout()">Sign Out</button>
  </div>

  <h1>UrbanGround &mdash; Voice Task Manager</h1>

  <button id="mic-btn" title="Hold to record">
    <!-- microphone icon -->
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
         stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M19 10a7 7 0 0 1-14 0"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="8"  y1="22" x2="16" y2="22"/>
    </svg>
  </button>

  <div id="status">Click the mic to start listening</div>

  <div id="transcript-box"><span id="final-text"></span><span id="interim-text" class="interim"></span></div>



  <script>
    const micBtn      = document.getElementById('mic-btn');
    const statusEl    = document.getElementById('status');
    const finalEl     = document.getElementById('final-text');
    const interimEl   = document.getElementById('interim-text');

    // ── Auth Check ────────────────────────────────────────────────────────
    // Verify the user is logged in before showing the app
    fetch('/api/auth/get-session', { credentials: 'include' })
      .then(res => res.json())
      .then(data => {
        if (!data || !data.session) {
          window.location.href = '/login.html';
          return;
        }
        // Show the user's name in the top bar
        const userName = data.user?.name || data.user?.email || '';
        document.getElementById('user-name').textContent = userName;
      })
      .catch(() => {
        window.location.href = '/login.html';
      });

    async function handleLogout() {
      await fetch('/api/auth/sign-out', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    }

    // ── Speech Recognition (Deepgram) ─────────────────────────────────────
    let DEEPGRAM_API_KEY = '';

    // Fetch configuration from the backend
    fetch('/api/config')
      .then(res => res.json())
      .then(data => { DEEPGRAM_API_KEY = data.deepgramKey; })
      .catch(err => console.error('Failed to load config:', err));

    let socket;
    let mediaRecorder;
    let listening = false;
    let stream;

    async function sendToBackend(text) {
      if (!text.trim()) return;
      statusEl.className = 'state-thinking';
      statusEl.innerHTML = 'Thinking<span class="dots"></span>';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ message: text.trim() })
        });

        if (res.status === 401) {
          window.location.href = '/login.html';
          return;
        }

        if (!res.ok) {
          throw new Error(`Backend error: ${res.status}`);
        }

        const data = await res.json();
        if (data.reply) {
          finalEl.textContent += `[Qwen]: ${data.reply}\n`;
          speakReply(data.reply);
          listening = true;
          micBtn.classList.add('listening');
          statusEl.textContent = 'Listening…';
          interimEl.textContent = '';
        }
      } catch (err) {
        console.error(err);
        statusEl.className = 'state-error';
        statusEl.textContent = 'Error connecting to backend';
        speakReply("Sorry, I'm having trouble connecting to my brain right now.");
      }
    }

    let currentAiSpeech = '';
    let currentAudio = null;

    async function speakReply(text) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      
      currentAiSpeech = text.toLowerCase();
      
      try {
        const response = await fetch('https://api.deepgram.com/v1/speak?model=aura-athena-en', {
          method: 'POST',
          headers: {
            'Authorization': `Token ${DEEPGRAM_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ text: text })
        });
        
        if (!response.ok) throw new Error('Deepgram TTS failed');
        
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        currentAudio = new Audio(url);
        
        currentAudio.onended = () => {
          // Keep the text around for 1.5 seconds after speaking finishes to catch delayed echoes
          setTimeout(() => { currentAiSpeech = ''; }, 1500);
        };
        
        currentAudio.play();
      } catch (err) {
        console.error('[TTS] Error:', err);
        // Fallback to native Web Speech API
        if ('speechSynthesis' in window) {
          console.log('[TTS] Falling back to window.speechSynthesis');
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = 'en-US';
          window.speechSynthesis.speak(utt);
          
          utt.onend = () => {
            setTimeout(() => { currentAiSpeech = ''; }, 1500);
          };
        }
      }
    }

    micBtn.addEventListener('click', async () => {
      if (!listening) {
        statusEl.textContent = 'Requesting microphone…';
        try {
          stream = await navigator.mediaDevices.getUserMedia({ 
            audio: { 
              echoCancellation: true, 
              noiseSuppression: true 
            } 
          });
        } catch (err) {
          console.error('[STT] Mic permission denied:', err);
          statusEl.textContent = 'Microphone access denied.';
          return;
        }

        statusEl.textContent = 'Connecting to Deepgram…';
        socket = new WebSocket('wss://api.deepgram.com/v1/listen?endpointing=500', ['token', DEEPGRAM_API_KEY]);

        let currentUtterance = '';

        socket.onopen = () => {
          console.log('[STT] Connected to Deepgram');
          listening = true;
          micBtn.classList.add('listening');
          statusEl.textContent = 'Listening…';
          interimEl.textContent = '';

          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.addEventListener('dataavailable', event => {
            if (event.data.size > 0 && socket.readyState === 1) {
              socket.send(event.data);
            }
          });
          mediaRecorder.start(250);
        };

        socket.onmessage = (message) => {
          const received = JSON.parse(message.data);
          
          if (received.channel && received.channel.alternatives && received.channel.alternatives.length > 0) {
            const transcript = received.channel.alternatives[0].transcript;

            // Interruption: If the user starts speaking, stop TTS
            const isSpeaking = currentAudio && !currentAudio.paused;
            if (transcript.trim() && isSpeaking) {
              currentAudio.pause();
              currentAudio.currentTime = 0;
              currentAiSpeech = '';
            }

            if (received.is_final) {
              if (transcript) {
                currentUtterance += transcript + ' ';
              }
              
              if (received.speech_final) {
                sendToBackend(currentUtterance);
                currentUtterance = '';
              }
            }
          }
        };

        socket.onclose = () => {
          console.log('[STT] Connection closed');
          listening = false;
          micBtn.classList.remove('listening');
          statusEl.textContent = 'Click the mic to start listening';
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        };

        socket.onerror = (error) => {
          console.error('[STT] WebSocket Error:', error);
          statusEl.className = 'state-error';
          statusEl.textContent = 'Error connecting to Deepgram';
        };

      } else {
        // Stop listening
        listening = false;
        micBtn.classList.remove('listening');
        statusEl.textContent = 'Closing connection…';
        
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        
        if (socket && socket.readyState === 1) {
          // Send an empty JSON message as Deepgram recommends, or an empty byte buffer.
          // Deepgram officially requires sending an empty message to indicate end of stream 
          // (which usually is an empty byte array).
          socket.send(new Uint8Array(0));
        } else if (socket) {
           socket.close();
        }
      }
    });


  </script>
</body>
</html>
