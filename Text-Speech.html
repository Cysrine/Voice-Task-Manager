<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanGround Voice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
    }

    h1 { font-size: 1.4rem; letter-spacing: 0.05em; color: #aaa; }

    #mic-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid #555;
      background: #1e1e1e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    #mic-btn svg { pointer-events: none; }

    #mic-btn:hover { border-color: #888; }

    #mic-btn.listening {
      border-color: #e05;
      box-shadow: 0 0 0 6px rgba(238, 0, 85, 0.25);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(238, 0, 85, 0.25); }
      50%       { box-shadow: 0 0 0 14px rgba(238, 0, 85, 0.08); }
    }

    #status {
      font-size: 0.85rem;
      color: #666;
      min-height: 1.2em;
      text-align: center;
    }

    #transcript-box {
      width: 100%;
      max-width: 560px;
      min-height: 120px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #ddd;
    }

    #transcript-box .interim { color: #888; font-style: italic; }

    #tts-btn {
      padding: 10px 28px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #ccc;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #tts-btn:hover { background: #2e2e2e; }
    #tts-btn:active { background: #333; }

    .input-group {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 560px;
    }

    #chat-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #e8e8e8;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #chat-input:focus {
      border-color: #888;
    }

    #send-btn {
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #e05;
      background: #e05;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #send-btn:hover { background: #ff1a6b; border-color: #ff1a6b; }
    #send-btn:active { transform: scale(0.96); }

    /* DB Test Panel */
    .db-panel {
      width: 100%;
      max-width: 560px;
      margin-top: 32px;
      padding: 16px;
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
    }
    .db-panel h2 {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 12px;
      text-align: center;
    }
    .db-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .db-buttons button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #ccc;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .db-buttons button:hover { background: #2e2e2e; }
    #db-output {
      background: #000;
      border: 1px solid #222;
      padding: 12px;
      border-radius: 6px;
      color: #0f0;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>UrbanGround &mdash; Voice Scaffold</h1>

  <button id="mic-btn" title="Hold to record">
    <!-- microphone icon -->
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
         stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M19 10a7 7 0 0 1-14 0"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="8"  y1="22" x2="16" y2="22"/>
    </svg>
  </button>

  <div id="status">Click the mic to start listening</div>

  <div id="transcript-box"><span id="final-text"></span><span id="interim-text" class="interim"></span></div>

  <div class="input-group">
    <input type="text" id="chat-input" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>

  <button id="tts-btn">Speak hardcoded text</button>

  <div class="db-panel">
    <h2>Database Testing</h2>
    <div class="db-buttons">
      <button id="btn-create-task">Create Task</button>
      <button id="btn-list-tasks">List Tasks</button>
      <button id="btn-update-task">Update First Task</button>
      <button id="btn-delete-task">Delete First Task</button>
    </div>
    <div id="db-output">Awaiting DB action...</div>
  </div>

  <script>
    const micBtn      = document.getElementById('mic-btn');
    const statusEl    = document.getElementById('status');
    const finalEl     = document.getElementById('final-text');
    const interimEl   = document.getElementById('interim-text');
    const ttsBtn      = document.getElementById('tts-btn');
    const chatInput   = document.getElementById('chat-input');
    const sendBtn     = document.getElementById('send-btn');

    // ── Speech Recognition (Deepgram) ─────────────────────────────────────
    const DEEPGRAM_API_KEY = 'DEEPGRAM_KEY';

    let socket;
    let mediaRecorder;
    let listening = false;
    let stream;

    async function sendToBackend(text) {
      if (!text.trim()) return;
      statusEl.textContent = 'Thinking...';
      try {
        const res = await fetch('http://localhost:3000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text.trim() })
        });
        const data = await res.json();
        if (data.reply) {
          finalEl.textContent += `\n\n[Gemma]: ${data.reply}\n\n`;
          speakReply(data.reply);
          statusEl.textContent = 'Click the mic to start listening';
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error connecting to backend';
      }
    }

    function speakReply(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-US';
      window.speechSynthesis.speak(utt);
    }

    micBtn.addEventListener('click', async () => {
      if (!listening) {
        statusEl.textContent = 'Requesting microphone…';
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          console.error('[STT] Mic permission denied:', err);
          statusEl.textContent = 'Microphone access denied.';
          return;
        }

        statusEl.textContent = 'Connecting to Deepgram…';
        socket = new WebSocket('wss://api.deepgram.com/v1/listen?endpointing=500', ['token', DEEPGRAM_API_KEY]);

        let currentUtterance = '';

        socket.onopen = () => {
          console.log('[STT] Connected to Deepgram');
          listening = true;
          micBtn.classList.add('listening');
          statusEl.textContent = 'Listening…';
          interimEl.textContent = '';

          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.addEventListener('dataavailable', event => {
            if (event.data.size > 0 && socket.readyState === 1) {
              socket.send(event.data);
            }
          });
          mediaRecorder.start(250);
        };

        socket.onmessage = (message) => {
          const received = JSON.parse(message.data);
          
          if (received.channel && received.channel.alternatives && received.channel.alternatives.length > 0) {
            const transcript = received.channel.alternatives[0].transcript;

            if (transcript && received.is_final) {
              finalEl.textContent += transcript + ' ';
              interimEl.textContent = '';
              currentUtterance += transcript + ' ';
              
              if (received.speech_final) {
                sendToBackend(currentUtterance);
                currentUtterance = '';
              }
            } else if (transcript) {
              interimEl.textContent = transcript;
            }
          }
        };

        socket.onclose = () => {
          console.log('[STT] Connection closed');
          listening = false;
          micBtn.classList.remove('listening');
          statusEl.textContent = 'Click the mic to start listening';
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        };

        socket.onerror = (error) => {
          console.error('[STT] WebSocket Error:', error);
          statusEl.textContent = 'Error connecting to Deepgram';
        };

      } else {
        // Stop listening
        listening = false;
        micBtn.classList.remove('listening');
        statusEl.textContent = 'Closing connection…';
        
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        
        if (socket && socket.readyState === 1) {
          // Send an empty JSON message as Deepgram recommends, or an empty byte buffer.
          // Deepgram officially requires sending an empty message to indicate end of stream 
          // (which usually is an empty byte array).
          socket.send(new Uint8Array(0));
        } else if (socket) {
           socket.close();
        }
      }
    });

    // ── Text-to-Speech ────────────────────────────────────────────────────
    const HARDCODED = "Welcome to UrbanGround. Your voice assistant is ready.";

    ttsBtn.addEventListener('click', () => {
      if (!window.speechSynthesis) {
        alert('SpeechSynthesis not supported in this browser.');
        return;
      }
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(HARDCODED);
      utt.lang  = 'en-US';
      utt.rate  = 1;
      utt.pitch = 1;
      window.speechSynthesis.speak(utt);
    });

    // ── Text Input ────────────────────────────────────────────────────────
    async function handleSend() {
      const text = chatInput.value;
      if (!text.trim()) return;
      chatInput.value = '';
      finalEl.textContent += `\n\n[You]: ${text}\n\n`;
      await sendToBackend(text);
    }

    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleSend();
      }
    });

    // ── Database Test Logic ───────────────────────────────────────────────
    const dbOutput = document.getElementById('db-output');

    function logDB(msg, data) {
      dbOutput.textContent = `${msg}\n${JSON.stringify(data, null, 2)}`;
    }

    document.getElementById('btn-create-task').addEventListener('click', async () => {
      try {
        const res = await fetch('http://localhost:3000/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: 'Test Task ' + Math.floor(Math.random() * 1000) })
        });
        const data = await res.json();
        logDB('Created Task:', data);
      } catch (err) {
        logDB('Error creating task:', err);
      }
    });

    document.getElementById('btn-list-tasks').addEventListener('click', async () => {
      try {
        const res = await fetch('http://localhost:3000/api/tasks');
        const data = await res.json();
        logDB('List of Tasks:', data);
      } catch (err) {
        logDB('Error listing tasks:', err);
      }
    });

    document.getElementById('btn-update-task').addEventListener('click', async () => {
      try {
        const listRes = await fetch('http://localhost:3000/api/tasks');
        const tasks = await listRes.json();
        if (tasks.length === 0) return logDB('No tasks to update.', {});
        
        const firstTaskId = tasks[0].id;
        const newStatus = tasks[0].status === 'pending' ? 'done' : 'pending';
        
        const res = await fetch(`http://localhost:3000/api/tasks/${firstTaskId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const data = await res.json();
        logDB('Updated Task:', data);
      } catch (err) {
        logDB('Error updating task:', err);
      }
    });

    document.getElementById('btn-delete-task').addEventListener('click', async () => {
      try {
        const listRes = await fetch('http://localhost:3000/api/tasks');
        const tasks = await listRes.json();
        if (tasks.length === 0) return logDB('No tasks to delete.', {});
        
        const firstTaskId = tasks[0].id;
        
        const res = await fetch(`http://localhost:3000/api/tasks/${firstTaskId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        logDB('Deleted Task:', data);
      } catch (err) {
        logDB('Error deleting task:', err);
      }
    });
  </script>
</body>
</html>
